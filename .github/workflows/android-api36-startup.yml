name: CDDA Android 16 startup test
on:
  push:
    branches: [android/api-36-device-ci]
permissions:
  contents: read
  actions: read
jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ''
      - name: Provision an Android 16 emulator
        run: |
          mkdir -p evidence
          image='system-images;android-36;google_apis;x86_64'
          sdkmanager 'emulator' 'platform-tools' "$image"
          sudo apt-get install -y acl
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          printf 'no\n' | avdmanager create avd --name cdda-api36 --package "$image" --force
      - name: Fetch the API 36 x86_64 APK from the build run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 36); do
            if gh run download 44210628051 --repo "$GITHUB_REPOSITORY" --name cdda-api36-x86_64 --dir apk; then
              test -s apk/cdda-api36-x86_64-test.apk
              exit
            fi
            if [[ $(gh run view 44210628051 --repo "$GITHUB_REPOSITORY" --json status --jq .status) == completed ]]; then
              exit 1
            fi
            sleep 30
          done
          exit 1
      - name: Verify fresh start, Back key and restart
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          app=com.cleverraven.cataclysmdda.experimental
          trap 'adb logcat -d -b crash > evidence/crash.log || true; adb logcat -d -t 2500 > evidence/logcat.txt || true' EXIT
          "$ANDROID_HOME/emulator/emulator" -avd cdda-api36 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect >evidence/emulator.log 2>&1 &
          timeout 240 adb wait-for-device
          timeout 240 bash -c 'until [[ $(adb shell getprop sys.boot_completed | tr -d "\r") == 1 ]]; do sleep 2; done'
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = 36
          adb shell input keyevent 82
          adb shell settings put secure show_ime_with_hard_keyboard 1
          adb install apk/cdda-api36-x86_64-test.apk
          adb shell monkey -p "$app" -c android.intent.category.LAUNCHER 1

          game_resumed() {
            adb shell dumpsys activity activities >evidence/activities.txt
            grep -E 'topResumedActivity|mResumedActivity' evidence/activities.txt | grep -Eq 'com\.cleverraven\.cataclysmdda\.experimental.*CataclysmDDA'
          }
          for attempt in $(seq 1 35); do
            if game_resumed; then break; fi
            if timeout 10 adb shell uiautomator dump /sdcard/cdda-test-window.xml >/dev/null 2>&1; then
              adb exec-out cat /sdcard/cdda-test-window.xml >"$RUNNER_TEMP/cdda-window.xml"
              tap=$(python3 - "$RUNNER_TEMP/cdda-window.xml" "$app" <<'PY'
          import re
          import sys
          import xml.etree.ElementTree as ET
          nodes = list(ET.parse(sys.argv[1]).iter('node'))
          for node in nodes:
              if node.get('package') != sys.argv[2]:
                  continue
              label = node.get('text', '').casefold().strip()
              if label == 'installation failed':
                  raise SystemExit('CDDA could not install its game data')
              if node.get('resource-id') == 'android:id/button1' and label in ('start game', 'ok'):
                  x1, y1, x2, y2 = map(int, re.findall(r'\d+', node.get('bounds', '')))
                  print((x1 + x2) // 2, (y1 + y2) // 2)
                  break
          PY
              )
              if [[ -n "$tap" ]]; then adb shell input tap $tap; fi
            fi
            sleep 2
          done
          game_resumed
          sleep 7
          adb shell pidof "$app"
          adb exec-out screencap -p >evidence/android16-menu.png
          adb shell dumpsys input_method >evidence/ime-before-back.txt
          adb shell input keyevent KEYCODE_BACK
          sleep 3
          game_resumed
          adb shell dumpsys input_method >evidence/ime-after-back.txt
          adb exec-out screencap -p >evidence/android16-after-back.png
          for log in evidence/ime-*-back.txt; do echo "$log"; grep -Ei 'mInputShown|mShowRequested|mIsInputViewShown|imeShowing' "$log" || true; done
          adb shell am force-stop "$app"
          adb shell monkey -p "$app" -c android.intent.category.LAUNCHER 1
          for attempt in $(seq 1 20); do
            if game_resumed; then break; fi
            sleep 2
          done
          game_resumed
          adb shell pidof "$app"
          adb logcat -b crash -d >evidence/crash.log
          if grep -F "Process: $app," evidence/crash.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cdda-api36-device-evidence
          path: evidence/
          if-no-files-found: ignore
          retention-days: 14
