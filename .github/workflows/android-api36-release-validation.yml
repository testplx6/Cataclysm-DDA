name: CDDA Android API 36 and 16 KB validation
on:
  push:
    branches: [android/api-36-release-ci]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-api36-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Build and verify (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            gradle: -Pabi_arm_32=false
          - abi: x86_64
            gradle: -Pabi_arm_32=false -Pabi_arm_64=false -Pabi_x86_64=true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b278ca1e3b1f7a39ff44d2249c9b769be3f4c105
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ''
      - name: Provision Android SDK and build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ccache gettext
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.1.13356709' 'cmake;3.22.1'
      - name: Use the verified 16 KB SDL3_ttf dependency
        run: |
          set -euo pipefail
          release=https://github.com/testplx6/Cataclysm-DDA/releases/download/sdl3-ttf-3.2.3-android-16k
          package=SDL3_ttf-devel-3.2.3-android.zip
          mkdir -p "$RUNNER_TEMP/ttf"
          for attempt in $(seq 1 48); do
            if curl -fsSL "$release/SHA256SUMS" -o "$RUNNER_TEMP/ttf/SHA256SUMS"; then break; fi
            sleep 15
          done
          curl -fsSL --retry 3 "$release/$package" -o "$RUNNER_TEMP/ttf/$package"
          (cd "$RUNNER_TEMP/ttf" && sha256sum -c SHA256SUMS)
          export TTF_SHA256=$(sha256sum "$RUNNER_TEMP/ttf/$package" | awk '{print $1}')
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('android/app/build.gradle')
          script = path.read_text()
          old = "[name: 'SDL3_ttf',    version: '3.2.2', repo: 'SDL_ttf',\n     zipSha256: '48e534daf88eec5c7f0c95fa6ca0e8a5f38f5fc7276824573131cebc403ee14c'],"
          new = "[name: 'SDL3_ttf',    version: '3.2.3',\n     url: 'https://github.com/testplx6/Cataclysm-DDA/releases/download/sdl3-ttf-3.2.3-android-16k/SDL3_ttf-devel-3.2.3-android.zip',\n     zipSha256: '" + os.environ['TTF_SHA256'] + "'],"
          downloader = 'def url = "https://github.com/libsdl-org/'
          assert script.count(old) == script.count(downloader) == 1
          path.write_text(script.replace(old, new).replace(downloader, 'def url = entry.url ?: "https://github.com/libsdl-org/'))
          PY
      - name: Compile experimental release
        working-directory: android
        env:
          ABI: ${{ matrix.abi }}
          ABI_FLAGS: ${{ matrix.gradle }}
        run: |
          tasks=(assembleExperimentalRelease)
          if [[ "$ABI" == arm64-v8a ]]; then tasks+=(bundleExperimentalRelease); fi
          read -r -a abi_flags <<< "$ABI_FLAGS"
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace -Pj=3 "${abi_flags[@]}" "${tasks[@]}"
      - name: Sign APK for testing and verify target API and native alignment
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p validation
          apk=$(find android/app/build/outputs/apk/experimental/release -name '*.apk' -print -quit)
          [[ -n "$apk" ]]
          "$tools/zipalign" -P 16 -f 4 "$apk" "$RUNNER_TEMP/cdda-aligned.apk"
          keytool -genkeypair -keystore "$RUNNER_TEMP/cdda-test.jks" -storepass android -keypass android -keyalg RSA -keysize 2048 -alias cdda-test -validity 365 -dname 'CN=CDDA API 36 CI test'
          signed="validation/cdda-api36-$ABI-test.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/cdda-test.jks" --ks-pass pass:android --key-pass pass:android --out "$signed" "$RUNNER_TEMP/cdda-aligned.apk"
          "$tools/apksigner" verify "$signed"
          "$tools/zipalign" -P 16 -c 4 "$signed"
          "$tools/aapt" dump badging "$signed" | tee validation/apk-manifest.txt
          grep -Fx "targetSdkVersion:'36'" validation/apk-manifest.txt
          if [[ "$ABI" == arm64-v8a ]]; then
            cp android/app/build/outputs/bundle/experimentalRelease/*.aab validation/cdda-api36-unsigned.aab
          fi
          python3 - "$signed" validation/*.aab <<'PY' | tee validation/native-alignment.txt
          import struct
          import sys
          import zipfile
          from pathlib import Path
          for filename in map(Path, sys.argv[1:]):
              if filename.name == '*.aab':
                  continue
              with zipfile.ZipFile(filename) as package:
                  libraries = [name for name in package.namelist() if name.startswith(('lib/', 'base/lib/')) and name.endswith('.so')]
                  assert libraries, f'{filename}: no native libraries'
                  for name in libraries:
                      data = package.read(name)
                      assert data.startswith(b'\x7fELF\x02\x01'), name
                      offset = struct.unpack_from('<Q', data, 32)[0]
                      size, count = struct.unpack_from('<HH', data, 54)
                      loads = [struct.unpack_from('<Q', data, pos + 48)[0] for pos in range(offset, offset + size * count, size) if struct.unpack_from('<I', data, pos)[0] == 1]
                      assert loads and min(loads) >= 16384, (name, loads)
                      print(f'{filename.name}: {name} LOAD alignment {loads}')
          PY
      - name: Validate the unsigned Play bundle and confirm 16 KB APK split alignment
        if: matrix.abi == 'arm64-v8a'
        run: |
          jar="$RUNNER_TEMP/bundletool.jar"
          curl -fsSL --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$jar"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $jar" | sha256sum -c -
          bundle=validation/cdda-api36-unsigned.aab
          java -jar "$jar" validate --bundle="$bundle"
          java -jar "$jar" dump config --bundle="$bundle" | tee validation/bundle-config.txt
          grep -F PAGE_ALIGNMENT_16K validation/bundle-config.txt
          (cd validation && sha256sum *.apk *.aab > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cdda-api36-${{ matrix.abi }}
          path: validation/
          if-no-files-found: ignore
          retention-days: 14
