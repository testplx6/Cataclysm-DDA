name: CDDA Android emulator verification
on:
  push:
    branches: [android/api-36-emulator-ci]
permissions:
  contents: read
  actions: read
jobs:
  startup:
    name: Android ${{ matrix.api }} / ${{ matrix.page_size }} bytes
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 36
            target: google_apis
            page_size: 4096
            build_run: 44210628051
          - api: 35
            target: google_apis_ps16k
            page_size: 16384
            build_run: 44214734878
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ''
      - name: Enable hardware acceleration for this runner
        run: |
          sudo apt-get install -y acl
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Fetch the built APK
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ matrix.build_run }}
        run: |
          for attempt in $(seq 1 58); do
            if gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name cdda-api36-x86_64 --dir apk; then
              test -s apk/cdda-api36-x86_64-test.apk
              exit
            fi
            if [[ $(gh run view "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --json status --jq .status) == completed ]]; then
              exit 1
            fi
            sleep 30
          done
          exit 1
      - name: Prepare the startup test
        run: |
          mkdir -p evidence
          cat > "$RUNNER_TEMP/cdda-smoke.sh" <<'BASH'
          set -euo pipefail
          app=com.cleverraven.cataclysmdda.experimental
          trap 'timeout 10 adb logcat -d -b crash > evidence/crash.log || true; timeout 10 adb logcat -d -t 2500 > evidence/logcat.txt || true' EXIT
          timeout 10 adb shell getprop ro.build.version.sdk | tr -d '\r' | tee evidence/api-level.txt
          timeout 10 adb shell getconf PAGE_SIZE | tr -d '\r' | tee evidence/page-size.txt
          test "$(cat evidence/api-level.txt)" = "$EXPECTED_API"
          test "$(cat evidence/page-size.txt)" = "$EXPECTED_PAGE_SIZE"
          adb shell input keyevent 82
          adb shell settings put secure show_ime_with_hard_keyboard 1
          timeout 60 adb install apk/cdda-api36-x86_64-test.apk
          adb shell monkey -p "$app" -c android.intent.category.LAUNCHER 1

          game_resumed() {
            timeout 10 adb shell dumpsys activity activities >evidence/activities.txt
            grep -E 'topResumedActivity|mResumedActivity' evidence/activities.txt | grep -Eq 'com\.cleverraven\.cataclysmdda\.experimental.*CataclysmDDA'
          }
          for attempt in $(seq 1 35); do
            if game_resumed; then break; fi
            if timeout 10 adb shell uiautomator dump /sdcard/cdda-test-window.xml >/dev/null 2>&1; then
              adb exec-out cat /sdcard/cdda-test-window.xml >"$RUNNER_TEMP/cdda-window.xml"
              tap=$(python3 - "$RUNNER_TEMP/cdda-window.xml" "$app" <<'PY'
          import re
          import sys
          import xml.etree.ElementTree as ET
          nodes = list(ET.parse(sys.argv[1]).iter('node'))
          for node in nodes:
              if node.get('package') != sys.argv[2]:
                  continue
              label = node.get('text', '').casefold().strip()
              if label == 'installation failed':
                  raise SystemExit('CDDA could not install its game data')
              if node.get('resource-id') == 'android:id/button1' and label in ('start game', 'ok'):
                  x1, y1, x2, y2 = map(int, re.findall(r'\d+', node.get('bounds', '')))
                  print((x1 + x2) // 2, (y1 + y2) // 2)
                  break
          PY
              )
              if [[ -n "$tap" ]]; then adb shell input tap $tap; fi
            fi
            sleep 2
          done
          game_resumed
          sleep 7
          adb shell pidof "$app"
          adb exec-out screencap -p >evidence/android16-menu.png
          adb shell dumpsys input_method >evidence/ime-before-back.txt
          adb shell input keyevent KEYCODE_BACK
          sleep 3
          game_resumed
          adb shell dumpsys input_method >evidence/ime-after-back.txt
          adb exec-out screencap -p >evidence/android16-after-back.png
          for log in evidence/ime-*-back.txt; do echo "$log"; grep -Ei 'mInputShown|mShowRequested|mIsInputViewShown|imeShowing' "$log" || true; done
          adb shell am force-stop "$app"
          adb shell monkey -p "$app" -c android.intent.category.LAUNCHER 1
          for attempt in $(seq 1 20); do
            if game_resumed; then break; fi
            sleep 2
          done
          game_resumed
          adb shell pidof "$app"
          timeout 10 adb logcat -b crash -d >evidence/crash.log
          if grep -F "Process: $app," evidence/crash.log; then exit 1; fi
          BASH
      - name: Verify CDDA first launch, Back key and restart
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          EXPECTED_API: ${{ matrix.api }}
          EXPECTED_PAGE_SIZE: ${{ matrix.page_size }}
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          emulator-boot-timeout: 300
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader -no-snapshot -no-audio -no-boot-anim -camera-back none
          script: timeout 420 bash "$RUNNER_TEMP/cdda-smoke.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-evidence-${{ matrix.page_size }}
          path: evidence/
          if-no-files-found: ignore
          retention-days: 14
